[workspace]
resolver = "2"
members = ["crates/demix", "crates/demix-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rzafiamy/demix-rs"
keywords = ["source-separation", "candle", "audio", "roformer", "gguf"]
categories = ["multimedia::audio", "science"]

[workspace.dependencies]
candle-core = "0.11"
candle-nn = "0.11"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
